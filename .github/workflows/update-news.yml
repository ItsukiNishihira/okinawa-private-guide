# 3つのサイトから最新記事を自動で集めて dashboard/data/articles.json を更新します。
# 日本時間 6時・12時・18時・0時ごろに実行（GitHub の混雑で数分〜数十分遅れることがあります）。
# 「Actions」タブ →「ニュース自動更新」→「Run workflow」で手動実行もできます。
name: ニュース自動更新

on:
  schedule:
    - cron: "7 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 記事を収集
        run: python scripts/fetch_news.py

      - name: 変更があれば保存（コミット）
        run: |
          if git diff --quiet -- dashboard/data/articles.json; then
            echo "新しい記事はありませんでした"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add dashboard/data/articles.json
          git commit -m "ニュースを自動更新 ($(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M'))"
          git push
