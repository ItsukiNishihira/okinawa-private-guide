<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Okinawa Guide</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#04101e;color:#d8eeff;font-family:Georgia,serif;min-height:100vh;padding-bottom:48px}
button{font-family:Georgia,serif}
.hdr{background:linear-gradient(180deg,#000a16,#04101e);padding:18px 20px 14px;border-bottom:1px solid #0f2a42}
.hdr-lbl{font-size:10px;letter-spacing:3px;color:#3a8ec4;font-family:sans-serif;margin-bottom:4px}
.hdr-ttl{font-size:20px;font-weight:bold;color:#fff}
.hdr-sub{font-size:12px;color:#5a9abf;font-family:sans-serif;margin-top:3px}
#dots{display:flex;justify-content:center;align-items:center;gap:7px;padding:14px 0 8px}
.dot{height:8px;border-radius:4px;border:none;cursor:pointer;padding:0;transition:all .3s}
.card{margin:10px 14px 0;border-radius:18px;overflow:hidden;border:1px solid #0f2a42}
.ph{width:100%;height:150px;background:#071625;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;border-bottom:1px solid #0f2a42}
.ph-emoji{font-size:36px}
.ph-txt{font-size:11px;color:#2a5a8c;font-family:sans-serif}
.hero{padding:20px 20px 16px}
.hero-stop{font-size:10px;letter-spacing:2px;color:rgba(255,255,255,.65);font-family:sans-serif;margin-bottom:4px}
.hero-name{font-size:24px;font-weight:bold;color:#fff;margin-bottom:4px}
.hero-sub{font-size:13px;color:rgba(255,255,255,.82);font-style:italic}
.pills{display:flex;gap:10px;margin-top:12px}
.pill{background:rgba(0,0,0,.32);border-radius:8px;padding:5px 13px;font-size:11px;font-family:sans-serif;color:#fff}
.abar{background:#071625;padding:13px 18px;display:flex;align-items:center;gap:14px;border-bottom:1px solid #0f2a42}
#audioBtn{width:48px;height:48px;border-radius:50%;border:none;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 4px 18px rgba(0,119,182,.35)}
.a-lbl{font-size:13px;font-family:sans-serif;color:#6ac4e8}
.a-sub{font-size:11px;color:#2a6080;font-family:sans-serif;margin-top:2px}
.body{background:#05121f;padding:18px 16px}
.para{line-height:1.8;font-size:14px;color:#b4d4ec;margin-bottom:13px}
.tip{background:#071e34;border:1px solid #0f3558;border-radius:12px;padding:12px 14px;margin-top:4px}
.tip-lbl{font-size:10px;color:#3a8ec4;letter-spacing:2px;font-family:sans-serif;margin-bottom:5px}
.tip-txt{font-size:13px;color:#90c4e4;line-height:1.6}
#finBtn{width:100%;margin-top:13px;border:1px solid #1a4a70;border-radius:12px;padding:11px 14px;cursor:pointer;display:flex;align-items:center;gap:10px;font-size:13px;font-family:sans-serif;text-align:left;color:#6ac4e8}
#finContent{display:none;background:#071e34;border-radius:0 0 12px 12px;border:1px solid #1a4a70;border-top:none;padding:14px 15px}
.fin-txt{font-size:13px;color:#a4cfe8;line-height:1.8;font-style:italic}
.nav{display:flex;gap:10px;padding:12px 14px 0}
.nbtn{flex:1;padding:12px 10px;border-radius:12px;font-size:13px;font-family:sans-serif;cursor:pointer;border:none}
.nprev{background:#0a1e30;border:1px solid #0f2a42!important;color:#6ac4e8}
.nprev:disabled{background:#071625;color:#1a3a52;cursor:default}
.nnext{color:#fff;font-weight:bold}
.nnext:disabled{background:#071625!important;color:#1a3a52;cursor:default}
</style>
</head>
<body>
<div class="hdr">
  <div class="hdr-lbl">OKINAWA PRIVATE GUIDE · DAY 1</div>
  <div class="hdr-ttl">North Okinawa Discovery</div>

</div>
<div id="dots"></div>
<div id="card" class="card"></div>
<div class="nav">
  <button id="prevBtn" class="nbtn nprev" onclick="go(cur-1)">←</button>
  <button id="nextBtn" class="nbtn nnext" onclick="go(cur+1)">→</button>
</div>

<script>
const IMAGES={
  1:"images/01_manzamo.jpg",
  2:"images/02_churaumi.jpg",
  3:"images/03_akahaka.jpg",
  4:"images/04_nakijin.jpg",
  5:"images/05_kouri.jpg",
  6:"images/06_heartrock.jpg",
  7:"images/07_otowadake.jpg"
};

const spots=[
{id:1,name:"Manzamo",subtitle:"The Cliff of Ten Thousand Seats",emoji:"🌊",
 gradient:"linear-gradient(135deg,#0077b6,#00b4d8)",accent:"#00b4d8",
 duration:"~30 min",entry:"¥100",
 body:["You are standing on the edge of a 20-meter limestone cliff shaped by the East China Sea over thousands of years. The rock jutting out before you resembles a giant elephant's trunk — this is the famous Elephant Nose, the symbol of Manzamo.",
       "In 1726, Ryukyu King Shokei declared it 'a meadow large enough to seat ten thousand people.' The word maa in Okinawan means grassland, giving the site its name: Man-za-mo.",
       "The rare plants growing on this limestone — including the Okinawa Violet and Okinawa Pine Phlox — are found nowhere else on Earth, making this a protected Natural Monument.",
       "A hidden path leads to Ura Manzamo — the quiet back side of the cliff, where you see the Elephant Nose from the opposite angle with almost no other visitors."],
 tip:"Photograph the Elephant Nose from the left side, facing west, in the morning light. Afternoon visits place the rock in shadow.",
 finland:"In Finland, you may have stood on the dramatic rocky shores of the archipelago, or looked out from a fell in Lapland. Manzamo offers a similarly raw encounter with geology. Both Finnish and Okinawan cultures share a deep reverence for nature as spiritual renewal — a concept Okinawans call nuchigusui, medicine for life.",
 audio:"Welcome to Manzamo, one of Okinawa's most iconic viewpoints. You are standing on the edge of a dramatic limestone cliff shaped by the East China Sea over thousands of years. The rock before you looks exactly like an elephant's trunk — the famous Elephant Nose. In 1726, King Shokei declared this a meadow large enough to seat ten thousand people. The rare plants growing here are found nowhere else on Earth. A hidden path leads to the quiet back side of the cliff, where you see the Elephant Nose from the opposite angle with almost no other tourists around."},

{id:2,name:"Churaumi Aquarium",subtitle:"The World's Ocean, Under One Roof",emoji:"🦈",
 gradient:"linear-gradient(135deg,#023e8a,#0096c7)",accent:"#0096c7",
 duration:"2–3 hours",entry:"¥2,090 / adult",
 body:["The centerpiece is the Kuroshio Sea tank — 35 meters wide, 27 meters deep, 10 meters tall. Its viewing panel is a single seamless sheet of acrylic glass over 60 cm thick, one of the largest in the world.",
       "The star is Jinta, a male whale shark. As of March 2026, Jinta has lived here for 31 years — the longest-living whale shark in captivity in world history. Whale sharks are the largest fish on Earth, yet feed only on plankton.",
       "Twice daily, a feeding demonstration shows Jinta rising vertically and opening his vast mouth to filter hundreds of liters of seawater. It is unlike anything you will see in any other aquarium.",
       "Recent milestones: world-first breeding of rare species in 2025–2026, and a newly renovated Deep Sea Exploration Room opened March 2026. Free dolphin shows and Emerald Beach are steps away."],
 tip:"Check the feeding schedule at the entrance. The Churaumi Theater seating gives the closest, most level view of Jinta.",
 finland:"Jinta's 31-year story is fundamentally about patience — an investment of care across an entire human generation. This mirrors Finland's world-leading approach to science and long-term environmental stewardship.",
 audio:"Welcome to Okinawa Churaumi Aquarium. The name Churaumi means beautiful ocean. The centerpiece is the Kuroshio Sea tank — 35 meters wide and 10 meters tall. The star is Jinta, a male whale shark. As of March 2026, Jinta has lived here for thirty-one years — the longest-living whale shark in captivity in the entire history of the world. Twice a day, a feeding demonstration shows Jinta rising vertically and opening his massive mouth. It is one of the most extraordinary sights you will ever see."},

{id:3,name:"Akahaka Beach",subtitle:"A Hidden Shore of Silence",emoji:"🏖️",
 gradient:"linear-gradient(135deg,#1b6ca8,#2ecc71)",accent:"#2ecc71",
 duration:"30–60 min",entry:"Free",
 body:["After the scale of Churaumi, Akahaka Beach offers something priceless: stillness. This undiscovered beach in northern Okinawa has extraordinarily clear water — you can see the seafloor at five meters depth.",
       "This is Yanbaru — the ancient forested highlands designated a UNESCO World Natural Heritage Site in 2021. The forests shelter rare creatures found nowhere else, including the Okinawa Rail, which locals call the ghost of the forest.",
       "No souvenir stands, no noise. Just the rhythm of waves and the feeling of having found something most visitors never will. This is nuchigusui — nature as medicine for life.",
       "Okinawans are among the world's longest-lived people. Many attribute this to a culture that treats moments of natural stillness as a necessity, not a luxury."],
 tip:"Bring water and sun protection — no facilities on the beach. The water is calm and perfect for a quiet swim.",
 finland:"Finns know this through metsärauha — the peace of the forest — or the quiet of a lakeside evening in summer. In both cultures, time in natural stillness is restorative, even sacred. Akahaka Beach is Okinawa's version of that Finnish summer cottage moment.",
 audio:"After Churaumi, Akahaka Beach offers something far rarer: stillness. This undiscovered beach in northern Okinawa has extraordinarily clear water. This is Yanbaru territory — the ancient forests designated a UNESCO World Natural Heritage Site in 2021. Take off your shoes. Let the sand hold the warmth of the afternoon. Listen to the ocean. This is nuchigusui — an Okinawan concept meaning medicine for life."},

{id:4,name:"Nakijin Castle",subtitle:"A World Heritage Fortress at the Edge of the Sky",emoji:"🏯",
 gradient:"linear-gradient(135deg,#6a0572,#c77dff)",accent:"#c77dff",
 duration:"60–90 min",entry:"¥600",
 body:["Nakijin Castle dates to the 13th century, sitting 100 meters above sea level with ocean views in three directions. It was inscribed as a UNESCO World Heritage Site in 2000.",
       "Its limestone walls stretch 1.5 km without mortar — only precisely fitted natural stones. They curve with the hill's contours: working with the land, not against it. The effect is both formidable and beautiful.",
       "The last king, Han Anchi, faced overwhelming forces in 1416 with only seventeen knights. He reportedly said: We are the warriors of the North Mountain. Let us face our end so future generations will not laugh at us.",
       "Inside the castle, the sacred Uchibaru was tended exclusively by women priestesses, connecting the living world to the spiritual — a tradition of female spiritual leadership that continues in Okinawa today."],
 tip:"Wear sturdy shoes — the stone path is uneven. The panoramic view from the main hall is the finest on today's entire tour.",
 finland:"Finland has its own history of a small nation maintaining identity against larger forces. Han Anchi's last words carry the same spirit as the Finnish concept of sisu — the quiet, stubborn refusal to be erased. At Nakijin, you stand in the ruins of that same force.",
 audio:"Before you stands one of the most dramatic castle ruins in all of Asia. Nakijin Castle dates to the thirteenth century, sitting one hundred meters above sea level. In the year 2000, it was inscribed as a UNESCO World Heritage Site. Its stone walls stretch 1.5 kilometers, built without mortar. The last king, Han Anchi, faced overwhelming forces in 1416. With only seventeen knights, he said: We are the warriors of the North Mountain. Let us face our end so that future generations will not laugh at us."},

{id:5,name:"Kouri Island",subtitle:"The Island of Love — and the Beginning of All Things",emoji:"🌅",
 gradient:"linear-gradient(135deg,#e07b00,#fcbf49)",accent:"#fcbf49",
 duration:"60–90 min",entry:"Free",
 body:["Crossing Kouri Bridge — 1.9 km over the East China Sea — is one of the most beautiful drives in Japan. The water reveals extraordinary turquoise gradations, and sea turtles are spotted below more often than visitors expect.",
       "The island is called Kui-jima — Island of Love. Its ancient legend tells of the first man and woman descending from the heavens and landing here, gradually discovering language, desire, and connection.",
       "The cave where this legendary couple sheltered — the Cave of Beginnings — still exists on the island's shore. The legend predates any written record in Okinawa.",
       "Today the island is quietly rural — sugar cane fields, small restaurants serving sea urchin and sea grapes caught that morning. The Kouri Ocean Tower offers 360-degree panoramic views."],
 tip:"Stop at the center of Kouri Bridge for a photo. Fresh sea urchin at local restaurants is extraordinary in season (spring to early summer).",
 finland:"Finnish mythology — particularly the Kalevala — also contains creation stories rooted in islands and primordial water. Kouri's legend may feel strangely familiar. Both cultures understand that certain islands carry spiritual weight far beyond their physical beauty.",
 audio:"The drive across Kouri Bridge alone is worth the journey. The bridge stretches 1.9 kilometers across the East China Sea. The ocean opens in impossible shades of turquoise and deep blue. Kouri Island is called the Island of Love. Its ancient creation legend tells of the very first man and woman descending from the heavens here, discovering desire and connection. From their union, all human life spread outward. The cave where this legendary couple sheltered still exists on the island today."},

{id:6,name:"Heart Rock",subtitle:"Where the Ocean Carved a Love Letter",emoji:"❤️",
 gradient:"linear-gradient(135deg,#c1121f,#ff6b6b)",accent:"#ff6b6b",
 duration:"30–45 min",entry:"Parking ¥100",
 body:["Stand 15 meters from the waterline, slightly right of center. The two rocks of Tinu Beach align perfectly — the wave-carved base of the left rock reveals a natural heart shape. The gap between them forms a second, inverted heart.",
       "Tinu Beach is small, wild, and completely undeveloped — fine white sand, water clear enough to see coral below the surface.",
       "Heart Rock became nationally famous after a major airline filmed a television commercial here. Local folklore holds that couples who visit together find their bond strengthened.",
       "Practical notes: the descent involves a steep sandy slope — wear reliable shoes. At low tide you can approach the rocks closely; at high tide they create the most dramatic photogenic silhouette."],
 tip:"Stand 15m away, slightly right of center, for the perfect heart shape. Sunset creates a stunning silhouette. Check the tide table before visiting.",
 finland:"Finland celebrates love and partnership in a culture that values depth over performance. Heart Rock is exactly that kind of place: it does not announce itself. It rewards the people who pay attention. The quiet discovery of something this beautiful is the kind of memory that stays for a lifetime.",
 audio:"At the northern tip of Kouri Island, two small rocks stand side by side in the shallow water of Tinu Beach. They do not look like much at first. But stand fifteen meters away, slightly right of center, and something extraordinary happens. The sea has carved the base of the left rock into a perfect heart shape. And the space between the rocks forms a second heart, inverted, floating in the air. Nature made a love letter, and left it here for anyone patient enough to find it."},

{id:7,name:"Otowadake Observatory",subtitle:"The Island from Above — Your Perfect Ending",emoji:"🌄",
 gradient:"linear-gradient(135deg,#1b4332,#52b788)",accent:"#52b788",
 duration:"20–30 min",entry:"Free",
 body:["Atop a forested hill on Kouri Island's east side, the view from Otowadake Observatory opens suddenly and completely. Below: emerald fields, terracotta rooftops, and Kouri Bridge threading white across the sea.",
       "From this height, the ocean's color gradations become fully visible — turquoise over coral and sand, deep sapphire in the channels. As the sun descends, the light turns golden.",
       "This single view encompasses every place you visited today — Manzamo's cliff, the aquarium, the castle, the bridge, the beach — all visible in one glance.",
       "The Okinawan farewell blessing is Nifeedeebiruu — thank you from the bottom of my heart. Today, these islands have offered you something extraordinary. This is the right place to say thank you in return."],
 tip:"Arrive 60–90 minutes before sunset. The golden-hour light transforms the sea's colors dramatically, and the blue hour afterward is equally worth waiting for.",
 finland:"In Finnish, the word maisema describes not just a landscape's appearance, but the emotional experience of it — a view that enters you and stays. The reluctance you may feel to leave is the highest compliment a landscape can receive.",
 audio:"Your day ends here, high above everything you have seen. The Otowadake Observatory sits atop a forested hill on Kouri Island. As you reach the platform, the view opens with breathtaking completeness. Below, Kouri Island spreads in a tapestry of emerald fields and terracotta rooftops. The Kouri Bridge stretches across the water like a thin white thread. From this height, the color gradations of the ocean become fully visible. The Okinawan farewell blessing is Nifeedeebiruu — thank you from the bottom of my heart."}
];

let cur=0,playing=false,showFin=false;

let utterance = null;

function stopSpeech(){
  window.speechSynthesis.cancel();
  utterance = null;
  playing = false;
}

function playSpeech(t){
  stopSpeech();

  // ボイス一覧を取得して英語ボイスを優先選択
  function doSpeak(voices){
    utterance = new SpeechSynthesisUtterance(t);
    utterance.lang = "en-US";
    utterance.rate = 0.82;
    utterance.pitch = 1.05;
    utterance.volume = 1.0;

    // 英語ネイティブボイスを探す
    const en = voices.filter(v => v.lang.startsWith("en"));
    const preferred = en.find(v => /Samantha|Karen|Daniel|Google US|Google UK/i.test(v.name))
                   || en.find(v => v.lang === "en-US")
                   || en[0];
    if(preferred) utterance.voice = preferred;

    utterance.onstart  = () => { playing = true;  updateAudio(); };
    utterance.onend    = () => { playing = false; utterance = null; updateAudio(); };
    utterance.onerror  = (e) => { console.warn("TTS error", e); playing = false; utterance = null; updateAudio(); };

    window.speechSynthesis.speak(utterance);

    // Chromeのバグ対策: 15秒ごとにresume()を呼ばないと止まる
    const keepAlive = setInterval(() => {
      if(!utterance){ clearInterval(keepAlive); return; }
      if(window.speechSynthesis.paused) window.speechSynthesis.resume();
    }, 10000);
    utterance.onend = () => {
      clearInterval(keepAlive);
      playing = false; utterance = null; updateAudio();
    };
  }

  const voices = window.speechSynthesis.getVoices();
  if(voices.length > 0){
    doSpeak(voices);
  } else {
    // ボイスリストが非同期で読み込まれる場合の対応
    window.speechSynthesis.onvoiceschanged = () => {
      window.speechSynthesis.onvoiceschanged = null;
      doSpeak(window.speechSynthesis.getVoices());
    };
    // 300ms後にもう一度試みる（Safariなど）
    setTimeout(() => {
      const v2 = window.speechSynthesis.getVoices();
      if(v2.length > 0 && !playing) doSpeak(v2);
    }, 300);
  }
}

function updateAudio(){
  const btn = document.getElementById("audioBtn");
  const lbl = document.getElementById("aLbl");
  const sub = document.getElementById("aSub");
  if(!btn) return;
  if(playing){
    btn.style.background = "linear-gradient(135deg,#c1121f,#ff6b6b)";
    btn.textContent = "⏹";
    lbl.textContent = "Narrating…";
    sub.textContent = "Tap again to stop";
  } else {
    btn.style.background = "linear-gradient(135deg,#0077b6,#00b4d8)";
    btn.textContent = "▶";
    lbl.textContent = "Tap to hear audio guide";
    sub.textContent = "Clear English · deep commentary";
  }
}

function go(i){ if(i<0||i>=spots.length)return; stopSpeech(); showFin=false; cur=i; render(); }
function toggleAudio(){ playing ? stopSpeech() : playSpeech(spots[cur].audio); updateAudio(); }
function toggleFin(){
  showFin=!showFin;
  const c=document.getElementById("finContent");
  const b=document.getElementById("finBtn");
  const a=document.getElementById("finArrow");
  const h=document.getElementById("finHint");
  c.style.display=showFin?"block":"none";
  b.style.borderRadius=showFin?"12px 12px 0 0":"12px";
  b.style.background=showFin?"#0a253e":"transparent";
  a.textContent=showFin?"▲":"▼";
  h.textContent=showFin?"Tap to close":"A note written especially for you";
}

function render(){
  const s=spots[cur];
  const img=IMAGES[s.id];
  const card=document.getElementById("card");
  card.innerHTML="";

  // Photo
  if(img){
    const i=document.createElement("img");
    i.src=img;i.alt=s.name;i.style.cssText="width:100%;height:200px;object-fit:cover;display:block";
    card.appendChild(i);
  }else{
    const d=document.createElement("div");d.className="ph";
    d.innerHTML=`<span class="ph-emoji">${s.emoji}</span><small class="ph-txt">Photo coming soon</small>`;
    card.appendChild(d);
  }

  // Hero
  const hero=document.createElement("div");
  hero.className="hero";hero.style.background=s.gradient;
  card.appendChild(hero);
  const stop=document.createElement("div");stop.className="hero-stop";stop.textContent=`STOP ${s.id} OF 7`;hero.appendChild(stop);
  const name=document.createElement("div");name.className="hero-name";name.textContent=s.name;hero.appendChild(name);
  const sub=document.createElement("div");sub.className="hero-sub";sub.textContent=s.subtitle;hero.appendChild(sub);
  const pills=document.createElement("div");pills.className="pills";
  ["⏱ "+s.duration,"🎟 "+s.entry].forEach(t=>{const p=document.createElement("span");p.className="pill";p.textContent=t;pills.appendChild(p);});
  hero.appendChild(pills);

  // Audio bar
  const abar=document.createElement("div");abar.className="abar";
  abar.innerHTML=`<button id="audioBtn" onclick="toggleAudio()" style="background:linear-gradient(135deg,#0077b6,#00b4d8)">▶</button><div><div id="aLbl" class="a-lbl">Tap to hear audio guide</div><div id="aSub" class="a-sub">Clear English · deep commentary</div></div>`;
  card.appendChild(abar);

  // Body
  const body=document.createElement("div");body.className="body";
  s.body.forEach(p=>{const el=document.createElement("p");el.className="para";el.textContent=p;body.appendChild(el);});

  // Tip
  const tip=document.createElement("div");tip.className="tip";
  const tl=document.createElement("div");tl.className="tip-lbl";tl.textContent="💡 GUIDE'S TIP";tip.appendChild(tl);
  const tt=document.createElement("div");tt.className="tip-txt";tt.textContent=s.tip;tip.appendChild(tt);
  body.appendChild(tip);

  // Finland
  const fb=document.createElement("button");fb.id="finBtn";fb.onclick=toggleFin;
  fb.style.cssText="background:transparent;color:#6ac4e8;border:1px solid #1a4a70;border-radius:12px";
  fb.innerHTML=`<span style="font-size:22px">🇫🇮</span><div style="flex:1"><div style="font-weight:bold;color:#9ad0ef;font-size:13px">Finland Connection</div><div id="finHint" style="font-size:11px;color:#3a7a9a;margin-top:2px">A note written especially for you</div></div><span id="finArrow" style="color:#3a7a9a">▼</span>`;
  body.appendChild(fb);

  const fc=document.createElement("div");fc.id="finContent";
  const ft=document.createElement("p");ft.className="fin-txt";ft.textContent=s.finland;fc.appendChild(ft);
  body.appendChild(fc);
  card.appendChild(body);

  // Dots
  const dots=document.getElementById("dots");dots.innerHTML="";
  spots.forEach((_,i)=>{
    const b=document.createElement("button");b.className="dot";
    b.style.width=(i===cur?26:8)+"px";
    b.style.background=i===cur?s.accent:i<cur?"#1a5580":"#0f2a42";
    b.onclick=()=>go(i);dots.appendChild(b);
  });

  // Nav
  const prev=document.getElementById("prevBtn");
  const next=document.getElementById("nextBtn");
  prev.disabled=cur===0;
  prev.textContent="← "+(cur>0?spots[cur-1].name:"—");
  next.disabled=cur===spots.length-1;
  next.style.background=cur<spots.length-1?s.gradient:"#071625";
  next.style.color=cur<spots.length-1?"#fff":"#1a3a52";
  next.textContent=cur<spots.length-1?spots[cur+1].name+" →":"Journey Complete ✓";
}

render();
</script>
</body>
</html>
