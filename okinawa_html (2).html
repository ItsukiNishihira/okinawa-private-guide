// ============================================================
// 状態管理
// ============================================================
let cur = 0, playing = false, showFin = false;

function stopSpeech() {
  window.speechSynthesis.cancel();
  playing = false;
}

function playSpeech(text) {
  stopSpeech();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US"; u.rate = 0.85; u.pitch = 1.0;
  u.onend = () => { playing = false; updateAudioUI(); };
  u.onerror = () => { playing = false; updateAudioUI(); };
  window.speechSynthesis.speak(u);
  playing = true;
}

function updateAudioUI() {
  const btn = document.getElementById("audioBtn");
  const lbl = document.getElementById("audioLabel");
  const sub = document.getElementById("audioSub");
  if (!btn) return;
  if (playing) {
    btn.style.background = "linear-gradient(135deg,#c1121f,#ff6b6b)";
    btn.textContent = "⏹";
    lbl.textContent = "Narrating…";
    sub.textContent = "Tap again to stop";
  } else {
    btn.style.background = "linear-gradient(135deg,#0077b6,#00b4d8)";
    btn.textContent = "▶";
    lbl.textContent = "Tap to hear audio guide";
    sub.textContent = "Clear English · deep commentary";
  }
}

function go(i) {
  if (i < 0 || i >= spots.length) return;
  stopSpeech(); showFin = false; cur = i; render();
}

function toggleAudio() {
  playing ? stopSpeech() : playSpeech(spots[cur].audio);
  updateAudioUI();
}

function toggleFin() {
  showFin = !showFin;
  const content = document.getElementById("finContent");
  const btn = document.getElementById("finBtn");
  const arrow = document.getElementById("finArrow");
  const hint = document.getElementById("finHint");
  content.style.display = showFin ? "block" : "none";
  btn.style.borderRadius = showFin ? "12px 12px 0 0" : "12px";
  btn.style.background = showFin ? "#0a253e" : "transparent";
  arrow.textContent = showFin ? "▲" : "▼";
  hint.textContent = showFin ? "Tap to close" : "A note written especially for you";
}

// ============================================================
// 描画
// ============================================================
function render() {
  const s = spots[cur];
  const img = IMAGES[s.id];

  // 写真エリア
  const card = document.getElementById("card");
  card.innerHTML = "";

  const photoArea = img
    ? Object.assign(document.createElement("img"), { src: img, alt: s.name, className: "photo-real" })
    : (() => {
        const d = document.createElement("div");
        d.className = "photo-placeholder";
        d.innerHTML = `<span>${s.emoji}</span><small>Photo coming soon</small>`;
        return d;
      })();
  card.appendChild(photoArea);

  // ヒーロー
  const hero = document.createElement("div");
  hero.className = "hero";
  hero.style.background = s.gradient;
  hero.innerHTML = `
    <div class="hero-stop">STOP ${s.id} OF 7</div>
    <div class="hero-name" id="heroName"></div>
    <div class="hero-sub" id="heroSub"></div>
    <div class="pills">
      <span class="pill">⏱ ${s.duration}</span>
      <span class="pill">🎟 ${s.entry}</span>
    </div>`;
  card.appendChild(hero);
  document.getElementById("heroName").textContent = s.name;
  document.getElementById("heroSub").textContent = s.subtitle;

  // 音声バー
  const audioBar = document.createElement("div");
  audioBar.className = "audio-bar";
  audioBar.innerHTML = `
    <button id="audioBtn" onclick="toggleAudio()" class="nav-btn" style="width:50px;height:50px;border-radius:50%;border:none;cursor:pointer;font-size:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 4px 18px rgba(0,119,182,0.35)">▶</button>
    <div>
      <div id="audioLabel" class="audio-label">Tap to hear audio guide</div>
      <div id="audioSub" class="audio-sub">Clear English · deep commentary</div>
    </div>`;
  card.appendChild(audioBar);
  updateAudioUI();

  // 本文エリア
  const bodyArea = document.createElement("div");
  bodyArea.className = "body-area";

  s.body.forEach(p => {
    const el = document.createElement("p");
    el.className = "body-para";
    el.textContent = p;
    bodyArea.appendChild(el);
  });

  // Tip
  const tipBox = document.createElement("div");
  tipBox.className = "tip-box";
  tipBox.innerHTML = `<div class="tip-label">💡 GUIDE'S TIP</div>`;
  const tipText = document.createElement("div");
  tipText.className = "tip-text";
  tipText.textContent = s.tip;
  tipBox.appendChild(tipText);
  bodyArea.appendChild(tipBox);

  // Finland Connection
  const finBtn = document.createElement("button");
  finBtn.id = "finBtn";
  finBtn.onclick = toggleFin;
  finBtn.style.background = "transparent";
  finBtn.style.color = "#6ac4e8";
  finBtn.innerHTML = `
    <span class="fin-flag">🇫🇮</span>
    <div style="flex:1">
      <div class="fin-title">Finland Connection</div>
      <div class="fin-hint" id="finHint">A note written especially for you</div>
    </div>
    <span style="color:#3a7a9a" id="finArrow">▼</span>`;
  bodyArea.appendChild(finBtn);

  const finContent = document.createElement("div");
  finContent.id = "finContent";
  finContent.style.display = "none";
  const finText = document.createElement("p");
  finText.className = "fin-text";
  finText.textContent = s.finland;
  finContent.appendChild(finText);
  bodyArea.appendChild(finContent);

  card.appendChild(bodyArea);

  // 進捗ドット
  const dots = document.getElementById("dots");
  dots.innerHTML = "";
  spots.forEach((_, i) => {
    const btn = document.createElement("button");
    btn.className = "dot";
    btn.style.width = (i === cur ? 26 : 8) + "px";
    btn.style.background = i === cur ? s.accent : i < cur ? "#1a5580" : "#0f2a42";
    btn.onclick = () => go(i);
    dots.appendChild(btn);
  });

  // ナビゲーション
  const prev = document.getElementById("prevBtn");
  const next = document.getElementById("nextBtn");
  prev.disabled = cur === 0;
  prev.textContent = "← " + (cur > 0 ? spots[cur - 1].name : "—");
  next.disabled = cur === spots.length - 1;
  next.style.background = cur < spots.length - 1 ? s.gradient : "#071625";
  next.style.color = cur < spots.length - 1 ? "#fff" : "#1a3a52";
  next.textContent = cur < spots.length - 1 ? spots[cur + 1].name + " →" : "Journey Complete ✓";
}

render();
</script>
</body>
</html>
